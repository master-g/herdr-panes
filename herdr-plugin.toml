id = "panes"
name = "Panes"
version = "0.0.1"
min_herdr_version = "0.9.0"
description = "Dwindle-style splitting, master layout, and lossless pane geometry for Herdr."
platforms = ["linux", "macos"]

[[actions]]
id = "smart-split"
title = "Panes: smart split"
description = "Split the focused pane along its longer visual side."
contexts = ["pane"]
command = ["python3", "src/smart_split.py"]

[[actions]]
id = "equalize"
title = "Panes: equalize"
description = "Reset every split in the tab to an even ratio, without moving panes."
contexts = ["pane"]
command = ["python3", "src/equalize.py"]

[[actions]]
id = "promote"
title = "Panes: promote to master"
description = "Swap the focused pane into the master position."
contexts = ["pane"]
command = ["python3", "src/promote.py"]

[[actions]]
id = "master-width"
title = "Panes: cycle master width"
description = "Cycle the master pane through 1/3, 1/2 and 2/3."
contexts = ["pane"]
command = ["python3", "src/master_width.py"]

[[actions]]
id = "cycle"
title = "Panes: cycle layout"
description = "Cycle the tab through layout presets, moving panes only when the shape has to change."
contexts = ["pane"]
command = ["python3", "src/cycle.py"]
